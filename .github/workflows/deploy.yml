name: Deploy

on:
  push:
    branches: [main]

jobs:
  # Gate: only proceed when the head commit message contains "/build".
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.go }}
    steps:
      - id: gate
        # Pass the message through env (never interpolate ${{ }} straight into
        # the shell — a commit message is attacker-controllable).
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$MSG" | grep -qE '(^|[[:space:]])/build([[:space:]]|$)'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No '/build' in commit message — skipping deploy."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Builds (using netlify.toml) and deploys to production in one step.
      - name: Deploy to Netlify
        run: npx netlify-cli@17 deploy --build --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
